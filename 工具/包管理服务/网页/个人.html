<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人管理 · 豫言包管理</title><meta name="description" content="豫言包管理：获取、校验与发布程序包。"><link rel="stylesheet" href="/共用/主题.css"><link rel="stylesheet" href="/界面.css"><script defer src="/共用/界面.js"></script><script type="module" src="/包府.mjs"></script></head><body><div data-yuyan-site="packages" data-home="/"></div><main id="正文" class="包页"><p class="眉" data-han="豫言工具 / 包管理" data-wen="豫言之器 / 包府">豫言工具 / 包管理</p><h1 data-han="个人管理" data-wen="治己之包">个人管理</h1><p class="引" data-han="管理账户、所有者名称与自己发布的包。" data-wen="治账户，定主名，发布己包。">管理账户、所有者名称与自己发布的包。</p><div class="包入口"><a href="/" data-han="← 浏览包市场" data-wen="← 观包市">← 浏览包市场</a><a href="https://yuyan-lang.org/指南/仓库包构建.汉语.html" data-han="阅读豫构指南 →" data-wen="阅豫构之法 →">阅读豫构指南 →</a><a href="https://github.com/yuyan-lang/yuyan/blob/yybs/工具/包管理服务/使用说明.汉语.md" data-han="接口与发布说明 ↗" data-wen="接口与发布之法 ↗">接口与发布说明 ↗</a></div><section class="账户区" aria-labelledby="账户标题"><h2 id="账户标题" data-han="注册与发布" data-wen="立户而发布">注册与发布</h2><p data-han="使用邮箱和密码注册，验证邮箱后才能上传包。忘记密码时可通过邮箱重置。" data-wen="以邮箱密码立户，验邮箱而后上传；忘密可由邮箱更之。">使用邮箱和密码注册，验证邮箱后才能上传包。忘记密码时可通过邮箱重置。</p>
<div id="确认邮箱区" hidden tabindex="-1"><h3 data-han="完成邮箱验证" data-wen="成邮箱之验">完成邮箱验证</h3><p id="验证步骤" role="status" aria-live="polite" data-han="正在验证邮箱…" data-wen="正验邮箱…">正在验证邮箱…</p></div><form id="账户表单"><label for="账户邮箱" data-han="邮箱（不公开）" data-wen="邮箱（不公）">邮箱（不公开）</label><input id="账户邮箱" name="email" type="email" autocomplete="username" maxlength="254" required><label for="账户密码" data-han="密码（15–128 个字符）" data-wen="密码（十五至一百二十八字符）">密码（15–128 个字符）</label><input id="账户密码" name="password" type="password" autocomplete="current-password" minlength="1" maxlength="128" required><label id="接受区域" class="接受" hidden><input id="接受条款" type="checkbox"><span><span data-han="我已阅读并接受" data-wen="已阅且受">我已阅读并接受</span> <a href="https://yuyan-lang.org/条款/条款.汉语.html" target="_blank" rel="noopener" data-han="内测条款" data-wen="内测之约">内测条款</a> <span data-han="及" data-wen="与">及</span> <a href="https://yuyan-lang.org/条款/隐私.汉语.html" target="_blank" rel="noopener" data-han="隐私说明" data-wen="隐私之说">隐私说明</a></span></label><div class="账户操作"><button id="账户提交" type="submit" data-han="登录" data-wen="登入">登录</button><button id="切换账户模式" type="button" data-han="没有账户？注册" data-wen="尚无户？立之">没有账户？注册</button><button id="忘记密码" type="button" data-han="忘记密码？" data-wen="忘其密乎？">忘记密码？</button></div></form>
<div id="账户面板" hidden><p id="邮箱状态" role="status"></p><button id="重发验证" type="button" data-han="重发验证邮件" data-wen="再发验信">重发验证邮件</button><p id="账户身份" data-原文></p><span id="账户验证" class="验证标识" data-原文></span><p data-han="Access Token 仅用于绑定所有者名下的 ZIP 包发布，不能用于登录或绑定所有者名称。" data-wen="Access Token 惟供己主之包发布，不可登入或定主名。">Access Token 仅用于绑定所有者名下的 ZIP 包发布，不能用于登录或绑定所有者名称。</p><p data-han="上传令牌仅显示一次。生成新令牌会撤销你之前的全部上传令牌。请勿将令牌提交到代码仓库。" data-wen="上传之符惟示一次。新符既出，旧符尽废。勿藏符于代码仓库。">上传令牌仅显示一次。生成新令牌会撤销你之前的全部上传令牌。请勿将令牌提交到代码仓库。</p><div class="账户操作"><button id="生成上传令牌" type="button" data-han="生成上传令牌" data-wen="生上传之符">生成上传令牌</button><button id="撤销上传令牌" type="button" data-han="撤销全部令牌" data-wen="废诸符">撤销全部令牌</button><button id="退出账户" type="button" data-han="退出登录" data-wen="退出">退出登录</button></div><div id="令牌区域" hidden><label for="上传令牌" data-han="请立即保存令牌" data-wen="请即存符">请立即保存令牌</label><textarea id="上传令牌" readonly spellcheck="false" data-原文></textarea><button id="复制上传令牌" type="button" data-han="复制令牌" data-wen="复制此符">复制令牌</button></div><p><a href="https://github.com/yuyan-lang/yuyan/blob/yybs/工具/包管理服务/使用说明.汉语.md" data-han="使用令牌发布 ZIP 包 →" data-wen="持符发布 ZIP 包 →">使用令牌发布 ZIP 包 →</a></p></div><form id="找回表单" hidden><h3 data-han="找回密码" data-wen="寻回密码">找回密码</h3><label for="找回邮箱" data-han="注册邮箱" data-wen="立户邮箱">注册邮箱</label><input id="找回邮箱" type="email" autocomplete="email" maxlength="254" required><button type="submit" data-han="发送重置邮件" data-wen="发更密之信">发送重置邮件</button></form>
<form id="重置表单" hidden tabindex="-1"><h3 data-han="设置新密码" data-wen="立新密">设置新密码</h3><label for="新密码" data-han="新密码（15–128 个字符）" data-wen="新密（十五至一百二十八字符）">新密码（15–128 个字符）</label><input id="新密码" type="password" minlength="15" maxlength="128" autocomplete="new-password" required><label for="确认密码" data-han="再次输入新密码" data-wen="复书新密">再次输入新密码</label><input id="确认密码" type="password" minlength="15" maxlength="128" autocomplete="new-password" required><button type="submit" data-han="重置密码并撤销旧凭据" data-wen="更密且废旧符">重置密码并撤销旧凭据</button></form>
