<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>包管理 · 豫言</title><meta name="description" content="豫言包管理：获取、校验与发布程序包。"><link rel="stylesheet" href="/共用/主题.css"><link rel="stylesheet" href="/界面.css"><script defer src="/共用/界面.js"></script><script type="module" src="/包府.mjs"></script></head><body><div data-yuyan-site="packages" data-home="/"></div><main id="正文" class="包页"><p class="眉" data-han="豫言工具 / 包管理" data-wen="豫言之器 / 包府">豫言工具 / 包管理</p><h1 data-han="让程序，成为可分享的包。" data-wen="使程序成包，与人共用。">让程序，成为可分享的包。</h1><p class="引" data-han="通过豫构组织依赖，通过包管理服务获取、校验和发布程序包。" data-wen="以豫构理依赖，以包府取包、验包而发布之。">通过豫构组织依赖，通过包管理服务获取、校验和发布程序包。</p><div class="包入口"><a href="https://yuyan-lang.org/指南/仓库包构建.汉语.html" data-han="阅读豫构指南 →" data-wen="阅豫构之法 →">阅读豫构指南 →</a><a href="https://github.com/yuyan-lang/yuyan/blob/yybs/工具/包管理服务/使用说明.md" data-han="接口与发布说明 ↗" data-wen="接口与发布之法 ↗">接口与发布说明 ↗</a></div><section class="查包"><h2 data-han="获取一个包" data-wen="取一包">获取一个包</h2><p data-han="输入完整包文件名。包下载公开可用，发布需要上传令牌。" data-wen="书包之全名即可下载。取包无禁，发布须持上传之符。">输入完整包文件名。包下载公开可用，发布需要上传令牌。</p><form id="包查询"><label for="包名" data-han="包文件名" data-wen="包之名">包文件名</label><div><input id="包名" required maxlength="160" placeholder="parser-core-2.0.zip" autocomplete="off"><button type="submit" data-han="获取下载链接" data-wen="取下载之址">获取下载链接</button></div></form><p id="包提示" role="status"></p><a id="包下载" hidden data-han="下载此包 ↗" data-wen="取此包 ↗">下载此包 ↗</a><p class="注" data-han="这里只生成指定包的下载地址，不代表该包已经发布。服务当前不提供包搜索目录。" data-wen="此惟成指定包之址，非谓其包已发布。今未设搜包之册。">这里只生成指定包的下载地址，不代表该包已经发布。服务当前不提供包搜索目录。</p></section><div class="包步骤"><article><span>01</span><h2 data-han="组织依赖" data-wen="理其依赖">组织依赖</h2><p data-han="用显式包依赖描述标准库、工具与项目之间的关系。" data-wen="明书包之依赖，以叙标准库、器与项目之关系。">用显式包依赖描述标准库、工具与项目之间的关系。</p></article><article><span>02</span><h2 data-han="获取与校验" data-wen="取而验之">获取与校验</h2><p data-han="按名称与版本下载包，依照指南验证内容及摘要。" data-wen="循名与版取包，依法验其内容与摘要。">按名称与版本下载包，依照指南验证内容及摘要。</p></article><article><span>03</span><h2 data-han="发布与共享" data-wen="发布共用">发布与共享</h2><p data-han="持有上传令牌后，按准备、上传与确认流程发布。" data-wen="既持上传之符，循准备、上传、确认之序发布。">持有上传令牌后，按准备、上传与确认流程发布。</p></article></div></main><footer class="豫页脚"><span data-han="豫言包管理" data-wen="豫言包府">豫言包管理</span><a href="https://github.com/yuyan-lang/yuyan/issues" data-han="问题反馈" data-wen="报误">问题反馈</a></footer></body></html>
