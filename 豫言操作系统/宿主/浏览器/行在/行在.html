<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豫言操作系统 · 网页行在 · 豫言</title>
<link rel="stylesheet" href="/共用/主题.css">
<style>
/* 文言：页套主站之主题（/共用/主题.css 之页头、页脚与色）。汉语：页面套主站主题（/共用/主题.css 的页头、页脚与配色）。 */
main{max-width:960px;margin:0 auto;padding:28px clamp(20px,4vw,72px) 48px}
main h1{font:500 clamp(26px,3.4vw,38px)/1.4 var(--豫题);margin:0 0 8px}
.说明{color:var(--豫次);margin:0 0 16px}
#屏{white-space:pre-wrap;word-break:break-all;margin:0;background:var(--豫浅);border:1px solid var(--豫线);border-radius:6px;padding:12px 14px;font:13px/1.6 var(--豫码);min-height:24em;height:62vh;overflow:auto;cursor:text;outline:none}
#屏:focus-within,#屏.聚{border-color:var(--豫墨)}
#屏 .光标{background:var(--豫墨);color:var(--豫浅)}
/* 文言：受键之框隐于屏下，容输入法。汉语：接收按键与输入法的文本框藏在屏幕下面（透明、一像素），点屏幕就聚焦它。 */
#键{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none}
#状态{color:var(--豫次);font-size:13px}
/* 文言：屏：入桌面则惟留画布，满铺视口。汉语：屏幕：进入桌面后只留画布，铺满视口；回到命令行时隐藏。 */
canvas[data-yy-显示面]{display:none}
body.桌面中{margin:0;overflow:hidden}
body.桌面中> :not(canvas):not(input[data-yy-显示面输入]){display:none}
body.桌面中 canvas[data-yy-显示面]{display:block;position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none}
</style>

<main id="正文">
<h1>豫言操作系统 · 网页行在</h1>
<p class="说明">这是豫言操作系统的开机壳（豫构交互），与原生系统同一份程序：每句豫言都在浏览器里编译成单元再运行。点下面的屏幕直接打字，同原生开机壳缺省中文组字：字母拼成拼音，1-9 或空格选字，Esc 把字母当英文留下，{ } 输入引号；再次回车执行。输入「问津」列出命令，「图形」进入桌面；第一句要先编译标准库与壳命令，稍候片刻。</p>
<pre id="屏" aria-live="polite"></pre>
<textarea id="键" aria-label="向开机壳键入" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
<p id="状态">正在启动</p>
</main>
<footer class="豫页脚"><span>豫言 · 以中文写程序，以函数组织计算。<span id="提交"></span></span><nav><a href="https://github.com/yuyan-lang/yuyan">源码</a><a href="https://github.com/yuyan-lang/yuyan/issues">问题反馈</a></nav></footer>
<canvas width="1280" height="800" data-yy-显示面="主窗口"></canvas>
<script type="module">
// 汉语：页面只当屏幕与键盘：页面终端显示开机壳的输出，每个键原样送进壳的标准输入；命令全由同一个豫言程序（豫构交互）处理。
// 文言：页惟为屏与键：页之终端示开机壳之出，每键原样付壳之标准入；诸令皆由同一豫言程序（豫构交互）治之。
import {起行在} from './行在.mjs';
import {造终端} from './终端.mjs';
const 屏 = document.getElementById('屏'), 键 = document.getElementById('键'), 状态 = document.getElementById('状态');
let 会话 = null;
const 终端 = 造终端({屏, 键, 送: 文 => 会话?.送入(文), 原始: () => 会话?.原始() ?? true});
// 汉语：快照缺省取同目录的 源.tar.gz 与 工具.tar.gz，桌面的两个程序在 桌面.tar.gz（第一次进桌面才取）；本机测试可用网址参数 源=、工具=、桌面= 另指。
// 文言：快照默取同目之源、工具二档，桌面二程在桌面之档（初入桌面乃取）；本机之试可以网址之参另指。
const 参 = new URLSearchParams(location.search);
const 快照们 = [参.get('源') ?? './源.tar.gz', 参.get('工具') ?? './工具.tar.gz'].map(网址 => new URL(网址, location.href));
const 桌面快照 = new URL(参.get('桌面') ?? './桌面.tar.gz', location.href);
// 汉语：字体：各族名都声明为同一个文楷字体文件（缺省取站点 /操作系统/字体.ttf，网址参数 字体= 另指），宿主的字体能力按族名取它。
// 文言：字体：诸族名皆宣同一文楷之文（默取站之 /操作系统/字体.ttf，网址之参 字体= 另指），宿主之字体之能依族名取之。
for (const 族 of ['文楷', '无衬线', '衬线', '等宽', '衬线粗体', '等宽粗体']) {
  const 链 = document.createElement('link');
  链.setAttribute('data-yy-字体', 族);
  链.setAttribute('href', new URL(参.get('字体') ?? '../字体.ttf', location.href).href);
  document.head.append(链);
}
// 汉语：进出桌面：图形桌面任务拿到屏幕时只留画布，退出后回到命令行。文言：入出桌面：图形桌面之务得屏则惟留画布，退则复命令行。
const 示屏 = 开 => { document.body.classList.toggle('桌面中', 开); if (!开) 终端.聚焦(); };
const 出 = (流, 文) => 终端.写(文);
// 汉语：页脚写语言仓提交号（站点发布时写在 /操作系统/来源提交），报问题时对得上是哪一版。文言：页脚书语言仓之提交号（站布时书于 /操作系统/来源提交），报误则知其版。
fetch(new URL('../来源提交', location.href)).then(回 => (回.ok ? 回.text() : '')).then(号 => {
  号 = 号.trim();
  if (!/^[0-9a-f]{7,40}$/.test(号)) return;
  const 链 = document.createElement('a');
  链.href = 'https://github.com/yuyan-lang/yuyan/commit/' + 号;
  链.textContent = '语言仓 ' + 号;
  document.getElementById('提交').append(' · ', 链);
}).catch(() => {});
try {
  会话 = await 起行在({快照们, 桌面快照, 出, 示屏, 报: 文 => { 状态.textContent = 文; }});
  // 汉语：留给浏览器控制台查看任务表与文件（只读的调试入口）。文言：留之以供浏览器控制台察任务表与文件。
  globalThis.网页行在 = 会话;
  状态.textContent = '开机壳已起：点屏幕打字';
  终端.聚焦();
  const 记录 = await 会话.完成;
  状态.textContent = '开机壳已退出，退出码 ' + 记录.码;
} catch (错) {
  状态.textContent = '启动失败：' + (错?.message ?? 错);
  console.error(错);
}
</script>
