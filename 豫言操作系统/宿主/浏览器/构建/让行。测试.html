<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>处理器池让行测试</title>
<style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 20px}pre{white-space:pre-wrap}button{font:inherit;padding:8px 20px}</style>
<h1>处理器池让行测试</h1><p>从同目录读取值桥、长算、回声三个 .wasm（样例须带 <code>--让行检查点</code> 编），使用两个处理器 Worker。</p>
<button id="开始">开始测试</button><pre id="结果">等待开始</pre>
<script type="module">
// 汉语：让行检查点验收页：停不下来的纯计算任务与回显任务同在一个 Worker，回显照样跑完；再结束纯计算任务，得退出码一百三十。
// 文言：无尽之算与回声同居一工，回声犹得毕；召还无尽之算，得退码一百三十。
import {进程表} from './进程.mjs';
import {构建文件系统} from './文件系统.mjs';
const 结果 = document.querySelector('#结果'), 按钮 = document.querySelector('#开始'), 解码器 = new TextDecoder();
const 印 = 句 => { 结果.textContent += 句 + '\n'; };
const 核 = (条件, 句) => { 印((条件 ? '通过：' : '失败：') + 句); if (!条件) throw Error(句); };
const 文出 = 块们 => 块们.map(块 => 解码器.decode(块)).join('');
const 候到 = async (条件, 毫秒, 句) => { const 起 = performance.now(); while (!条件()) { if (performance.now() - 起 > 毫秒) throw Error('等待超时：' + 句); await new Promise(成 => setTimeout(成, 20)); } };
async function 验收() {
  按钮.disabled = true; 结果.textContent = ''; document.documentElement.dataset.测试 = '运行';
  let 表, 限时;
  try {
    核(crossOriginIsolated, '页面跨源隔离');
    核(typeof WebAssembly.Suspending === 'function' && typeof WebAssembly.promising === 'function', 'JSPI 两项能力齐备');
    const 系统 = new 构建文件系统();
    const 取 = async 名 => { const 应 = await fetch(new URL(名 + '.wasm', import.meta.url)); if (!应.ok) throw Error('读取失败：' + 名 + '，状态 ' + 应.status); return new Uint8Array(await 应.arrayBuffer()); };
    const 桥模块 = await WebAssembly.compile(await 取('值桥'));
    for (const 名 of ['长算', '回声']) 系统.写('/' + 名 + '.wasm', await 取(名));
    表 = new 进程表({文件系统: 系统, 桥模块, 工作线程网址: new URL('./工作线程.mjs', import.meta.url), 处理器数: 2});
    const 长算模 = await 表.取模块('/长算.wasm');
    核(WebAssembly.Module.imports(长算模).some(项 => 项.module === 'yuyan:browser/v1' && 项.name === '让行'), '长算样例带让行检查点（导入 yuyan:browser/v1 的 让行）');
    const 测 = async () => {
      const 甲 = await 表.启动('/长算.wasm', [], '/');
      const 乙 = await 表.启动('/回声.wasm', [], '/'); 表.开入(乙);
      const 丙 = await 表.启动('/回声.wasm', [], '/'); 表.开入(丙);
      const 甲录 = 表.记录们.get(甲), 同线 = 甲录.线;
      核(表.记录们.get(丙).线 === 同线 && 表.记录们.get(乙).线 !== 同线, '长算与一个回显任务同在一个 Worker，另一个回显在另一个 Worker');
      await 候到(() => 文出(甲录.输出).includes('开算'), 10000, '长算打印开算');
      印('通过：长算已开算，正在无尽累加');
      let 起 = performance.now();
      表.送入(丙, '同线回声\n');
      const 丙毕 = await 表.候完成(丙), 丙用时 = Math.round(performance.now() - 起);
      核(丙毕.码 === 0 && 文出(丙毕.输出) === '同线回声\n' && 丙用时 < 3000, '同 Worker 的回显在长算旁边跑完：退出 ' + 丙毕.码 + '，用时 ' + 丙用时 + ' 毫秒');
      表.送入(乙, '邻线回声\n');
      const 乙毕 = await 表.候完成(乙);
      核(乙毕.码 === 0 && 文出(乙毕.输出) === '邻线回声\n', '另一个 Worker 的回显照常跑完');
      核(!甲录.完成, '长算仍在运行');
      起 = performance.now();
      核(表.处理(null, null, '召回', [甲]) === 0, '召回请求成功');
      const 甲毕 = await 表.候完成(甲), 甲用时 = Math.round(performance.now() - 起);
      核(甲毕.码 === 130 && 甲用时 < 3000 && 表.线程们.includes(同线), '结束纯计算任务得到 130，用时 ' + 甲用时 + ' 毫秒，Worker 保留');
      核(!文出(甲毕.输出).includes('不应到此'), '长算没有意外返回');
    };
    await Promise.race([测(), new Promise((成, 败) => { 限时 = setTimeout(() => 败(Error('验收超过一分钟')), 60000); })]);
    印('通过：全部验收完成'); document.documentElement.dataset.测试 = '通过';
  } catch (错) { 印('失败：' + (错.stack ?? 错)); document.documentElement.dataset.测试 = '失败'; }
  finally { clearTimeout(限时); 表?.停止(); 按钮.disabled = false; }
}
按钮.onclick = 验收;
if (new URL(location.href).searchParams.has('自动')) 验收();
</script></html>
