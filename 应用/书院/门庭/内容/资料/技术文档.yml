# 文言：篇以义类，次第相承。汉语：技术规范目录；标识与原文基名相同，两种语言共享顺序。
- name: 总纲
  group: 规范
  wen_group: 规制
  summary: 兼容目标、实现边界与基本数据模型。
  wen_summary: 定兼容之义、实现之界与数据之形。
- name: 子语言设计
  group: 规范
  wen_group: 规制
  summary: 各子语言共同遵守的设计原则：一种语法、后缀定种类、经无体声明相接、统一执行边界；以及它们在一个程序里怎样配合。
  wen_summary: 诸子语言共守之则：一法之语、缀定其类、以无体之声相接、执行之界唯一；及其于一程序中相配之道。
