# .github/actions/install-mac-dependencies/action.yml

name: 'Install Linux Software'
description: 'Installs Linux Yuyan Dependencies'
runs:
  using: 'composite'
  steps:
    - name: Install MLTon
      run: |
          wget https://phoenixnap.dl.sourceforge.net/project/mlton/mlton/20241230/mlton-20241230-1.amd64-linux.ubuntu-22.04_glibc2.35.tgz
          tar -xvzf mlton-20241230-1.amd64-linux.ubuntu-22.04_glibc2.35.tgz
          cd mlton-20241230-1.amd64-linux.ubuntu-22.04_glibc2.35/
          sudo make
          sudo make install
      shell: bash
    - name: Install the libraries
      run: |
        sudo apt install make llvm clang libgmp-dev
        sudo apt install libgc-dev libuv1-dev llvm libbsd-dev
      shell: bash
