# 文言：核型之工作流：凡拉取之请与推 yybs，惟核其型；余试皆归全量测试（main.yml），惟用户手发（用户 2026-11-13 定：全树之验惟核型，全树全量之试惟用户手起）。种取 pit-pc 之共用链（十一月十五日，#1859）：共用链之 豫构 以今源编一级原生豫构（显书林纳兼容六十四之鹄），乃以之核豫言编译器全包之型：所用之核型者出于今源，改编译器之请亦得其实。种随换链而新，不复候连续版之包（#1833 起步之死锁随之而解）；共用链为原生之布则 豫构 即原生豫构于本进程为之，换为合一之布则 豫构 指合一之豫言系统、付本机之虚机为之，此流两可。用户 2026-11-01 定：拉取之请惟核型，全量之试惟行于 yybs，发行惟一作，诸作皆行于自有之机。外来贡献者之请每轮须人许之乃行（彼之码行于 pit-pc），许前当阅其改。
# 汉语：类型检查工作流：每个拉取请求与每次推送 yybs 都只跑类型检查；其余测试都归全量测试（main.yml），只由用户手动触发（用户 2026-11-13 定：全树验证只做类型检查，全树全量测试只由用户手动起）。种子取 pit-pc 的共用链（2026-11-15，#1859）：用共用链的 豫构 把当前源码编成一级原生豫构（显写林纳、兼容六十四的目标），再用它类型检查豫言编译器全包：类型检查器出自当前源码，改编译器的拉取请求也查得准。种子随换链更新，不再等连续版本的包（#1833 的起步死锁随之没了）；共用链是原生布局时 豫构 就是原生豫构、在本进程里编，换成合一布局后 豫构 指向合一的豫言系统、交本机虚机编，这份工作流两种布局都能用。用户 2026-11-01 定：拉取请求只跑类型检查，全量测试只在 yybs 上跑，发布只有一个作业，所有作业都跑在自有机器上。外部贡献者的拉取请求每轮都要人点批准才跑（它的代码会在 pit-pc 上执行），批准前先看改动。
name: 类型检查

env:
  # 文言：pit-pc 之共用链：豫构（链）、执行器 皆在其中。
  # 汉语：pit-pc 的共用链：豫构（链接）与执行器都在里面。
  YY_TOOLCHAIN: /home/zc/repos/yuyan-worktrees/钩深军团/工具链

on:
  pull_request:
  push:
    branches: [yybs]
  workflow_dispatch:

permissions:
  contents: read

# 文言：同一请或 yybs 有新推则罢旧轮（新轮已含旧轮之改）。
# 汉语：同一个拉取请求或 yybs 有新推送时取消旧轮（新的一轮已含旧轮的改动）。
concurrency:
  group: 类型检查-${{ github.ref }}
  cancel-in-progress: true

# 文言：行于 pit-pc 之自托管 runner。runner 书 CI 之境变量，豫构见之则不经将作；故诸步皆去 CI 而行，构建乃经将作排队、用共享之缓。一级原生豫构所行之步加 豫言虚机=关，于本进程为之（AGENTS.md 许 pit-pc 不经虚机而构）。
# 汉语：跑在 pit-pc 的自托管 runner 上。runner 会设环境变量 CI，豫构见了就不经将作；所以每一步都去掉 CI 再跑，构建经将作排队、用共享缓存。一级原生豫构跑的步骤加 豫言虚机=关，在本进程里做（AGENTS.md 许 pit-pc 构建不经虚机）。
defaults:
  run:
    shell: env -u CI 豫言虚机=关 bash -e {0}

jobs:
  type-check:
    name: 类型检查
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # 文言：种为共用链之豫构；豫构自编，自带执行器。此步不加 豫言虚机=关：合一之布下付虚机为之。
      # 汉语：种子是共用链的豫构；豫构编自己时自带执行器。这一步不加 豫言虚机=关：合一布局下交虚机编。
      - name: 以 pit-pc 共用链的豫构编当前源码的一级原生豫构
        shell: env -u CI bash -e {0}
        run: |
          set -euo pipefail
          cp "$YY_TOOLCHAIN/执行器。树码" 执行器。树码
          "$YY_TOOLCHAIN/豫构" 构建 豫构 --输出 "$PWD/豫构。林纳。豫行" -- --目标 本机 --目标系统 林纳 --目标架构 兼容六十四 --执行器 "$PWD/执行器。树码"

      - name: 类型检查
        run: ./豫构。林纳。豫行 目标 类型检查 --不连带 -j "$(nproc)"

      # 文言：上传构建之志（.构建日志），败亦上传，以备析构建之时；式见 应用/度量/构建性能/日志格式.文言.md。
      # 汉语：上传本作业的构建日志（.构建日志 是隐藏目录，须显式包含），失败时也上传，供日后分析构建耗时；格式见 应用/度量/构建性能/日志格式.汉语.md。
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-类型检查
          path: .构建日志/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
