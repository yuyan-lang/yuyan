name: 部署豫言官方网站

env:
  YY_GC_INITIAL_HEAP_SIZE_MB: 512
  YY_GC_MAX_HEAP_SIZE_MB: 6144
  YY_BOOTSTRAP_URL: https://github.com/yuyan-lang/yuyan/releases/download/continuous-bootstrap/yuyan-bootstrap-bundle.tar.gz

on:
  push:
    branches: [yybs]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 从零构建官网、文档与源码树
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 安装豫言构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make libgmp-dev libgc-dev curl ripgrep

      - name: 安装稳定豫言编译器
        run: |
          set -euo pipefail
          bootstrap_archive="$RUNNER_TEMP/yuyan-bootstrap-bundle.tar.gz"
          bootstrap_root="$RUNNER_TEMP/yuyan-bootstrap"

          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output "$bootstrap_archive" \
            "$YY_BOOTSTRAP_URL"
          mkdir -p "$bootstrap_root"
          tar -xzf "$bootstrap_archive" -C "$bootstrap_root" --strip-components=1
          find "$bootstrap_root" -type f \( -name '._*' -o -name '.DS_Store' \) -delete

          if [[ -x "$bootstrap_root/构建.sh" ]]; then
            "$bootstrap_root/构建.sh"
            bundled_compiler="$bootstrap_root/豫言自举编译器"
          else
            "$bootstrap_root/build.sh"
            bundled_compiler="$bootstrap_root/yy_bundled_bs"
          fi
          install -m 755 "$bundled_compiler" ./yy_bs_stable

      - name: 从源码编译静态站生成器
        run: |
          make yy2_bs yy豫构引导
          ./yy豫构引导 构建 工具 源码树浏览器 --编译器 ./yy2_bs --输出 yybs_源码树网站
          ./yy豫构引导 构建 工具 文档网站生成器 入口 --编译器 ./yy2_bs --输出 yybs_文档网站

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 构建官方网站
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./网站
          destination: ./dist/网站

      - name: 恢复站点目录所有权
        run: |
          # 容器以超级用户建目录，宜归执行者，使后续可书。
          # Jekyll 容器以 root 创建输出目录，恢复为 runner 所有以便后续生成器写入。
          sudo chown -R "$(id -u):$(id -g)" dist/网站
          test -w dist/网站

      - name: 构建接口文档与源码树
        run: |
          ./yybs_文档网站 构建 豫言编译器/入口。豫 dist/网站/文档
          ./yybs_源码树网站 构建 dist/网站/源码

      - name: 验证完整站点
        run: |
          test -f dist/网站/index.html
          test -f dist/网站/文档/index.html
          test -f dist/网站/源码/index.html
          grep -Fq 'href="文档/"' dist/网站/index.html
          grep -Fq 'href="源码/"' dist/网站/index.html

      - name: 上传静态站
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/网站

  deploy:
    name: 发布 GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
