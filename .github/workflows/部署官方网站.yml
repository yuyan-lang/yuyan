name: 部署豫言官方网站

env:
  YY_GC_INITIAL_HEAP_SIZE_MB: 512
  YY_GC_MAX_HEAP_SIZE_MB: 6144
  YY_BOOTSTRAP_URL: https://github.com/yuyan-lang/yuyan/releases/download/continuous-bootstrap/yuyan-bootstrap-bundle.tar.gz

on:
  push:
    branches: [yybs]
  workflow_dispatch:

concurrency:
  group: yuyan-homepage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 从零构建官网、文档与源码树
    runs-on: ubuntu-latest
    # 自举与全站生成共用时限，三十分不足，故增至六十分。
    # 冷启动包含编译器自举、生成器编译和全站生成，需预留六十分钟。
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v6

      - name: 安装界面验证运行时
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 验证共用界面
        run: npm ci --prefix 网站 && npm test --prefix 网站

      - name: 安装豫言构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make libgmp-dev libgc-dev curl ripgrep

      - name: 安装稳定豫言编译器
        run: |
          set -euo pipefail
          bootstrap_archive="$RUNNER_TEMP/yuyan-bootstrap-bundle.tar.gz"
          bootstrap_root="$RUNNER_TEMP/yuyan-bootstrap"

          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output "$bootstrap_archive" \
            "$YY_BOOTSTRAP_URL"
          mkdir -p "$bootstrap_root"
          tar -xzf "$bootstrap_archive" -C "$bootstrap_root" --strip-components=1
          find "$bootstrap_root" -type f \( -name '._*' -o -name '.DS_Store' \) -delete

          if [[ -x "$bootstrap_root/构建.sh" ]]; then
            "$bootstrap_root/构建.sh"
            bundled_compiler="$bootstrap_root/豫言自举编译器"
          else
            "$bootstrap_root/build.sh"
            bundled_compiler="$bootstrap_root/yy_bundled_bs"
          fi
          install -m 755 "$bundled_compiler" ./yy_bs_stable

      - name: 从源码编译静态站生成器
        run: |
          make yy2_bs yy豫构引导
          ./yy豫构引导 构建 工具 源码树浏览器 --编译器 ./yy2_bs --输出 yybs_源码树网站
          ./yy豫构引导 构建 工具 文档网站生成器 入口 --编译器 ./yy2_bs --输出 yybs_文档网站

      - name: 生成双语教程与指南
        run: |
          ./yy豫构引导 构建 工具 网站资料生成 --编译器 ./yy2_bs --输出 yy网站资料
          ./yy网站资料
          mkdir -p 网站/教程/示例
          cp 文档/豫言赋/示例/* 网站/教程/示例/

      - name: 构建官方网站
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./网站
          destination: ./dist/网站

      - name: 恢复站点目录所有权
        run: |
          # 容器以超级用户建目录，宜归执行者，使后续可书。
          # Jekyll 容器以 root 创建输出目录，恢复为 runner 所有以便后续生成器写入。
          sudo chown -R "$(id -u):$(id -g)" dist/网站
          test -w dist/网站

      - name: 构建接口文档
        run: ./yybs_文档网站 构建 豫言编译器/入口。豫 dist/网站/文档

      - name: 构建源码树
        run: ./yybs_源码树网站 构建 dist/网站/源码

      - name: 验证完整站点
        run: |
          test -f dist/网站/index.html
          test -f dist/网站/教程/index.html
          test -f dist/网站/共用/界面.js
          test -f dist/网站/文档/主题.css
          test -f dist/网站/源码/通用.js
          test -f dist/网站/文档/index.html
          test -f dist/网站/源码/index.html
          grep -Fq 'href="文档/"' dist/网站/index.html
          grep -Fq 'href="源码/"' dist/网站/index.html

      - name: 保存完整静态站
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-homepage
          path: dist/网站
          retention-days: 7

  deploy:
    name: 发布 Cloudflare 静态网站
    environment:
      name: production
      url: https://yuyan-lang.org
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 获取已验证的静态站
        uses: actions/download-artifact@v4
        with:
          name: yuyan-homepage
          path: dist/网站
      - name: 检查发布凭据
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "缺少仓库 Secret：CLOUDFLARE_API_TOKEN"
            exit 1
          fi
      - name: 发布到 Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.129.0 deploy --config 网站/入口/发布配置.jsonc
