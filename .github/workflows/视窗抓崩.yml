# 文言：临时之流：以前轮所留之 Wasm 编译器与豫构，自本支之源重构执行器而交叉编视窗之例，乃于视窗逐一行之，崩则以 cdb 取其现场。合入前删之。
# 汉语：临时工作流：用前一轮 CI 留下的 Wasm 编译器与豫构（由本分支源码构建），从本分支源码重建执行器、交叉编出几个 Windows 样例，再在 Windows 上逐个运行，崩溃时用 cdb 抓现场。合入前删除。
name: 视窗抓崩
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 留有 yy-test-tools 产物（Wasm 编译器与豫构）的运行号
        required: true
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: 交叉编视窗样例
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          name: yy-test-tools
          path: ${{ runner.temp }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: 重建执行器并交叉编样例
        env:
          YY_GC_INITIAL_HEAP_SIZE_MB: 512
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/yy-test-tools.tar.gz"
          Y() { node 豫言操作系统/宿主/节点/宿主.cjs yy豫构.wasm "$@"; }
          Y 构建 客体二号 --编译器 ./yy4_bs.wasm --输出 yy视窗执行器.树码 -j 24
          mkdir -p 组
          for n in 打印 时间 递归列表 内建列 代数闭包 小数; do
            Y 文件 "豫言操作系统/裸机/普通探针/$n。脚本。豫" --编译器 ./yy4_bs.wasm --输出 "组/$n-x64.exe" -j 24 -- --目标 本机 --目标系统 视窗 --目标架构 兼容六十四 --执行器 "$PWD/yy视窗执行器.树码"
            cp "豫言操作系统/裸机/普通探针/$n.期望" "组/$n.expected"
          done
          ls -la 组
      - uses: actions/upload-artifact@v4
        with:
          name: yy-windows-crash-samples
          path: 组
          retention-days: 3
  crash-capture:
    name: 抓崩溃现场
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yy-windows-crash-samples
          path: 组
      - name: 逐个运行，崩溃时抓现场
        run: |
          set +e
          mkdir -p work
          CDB=
          for d in x64 arm64; do
            c="/c/Program Files (x86)/Windows Kits/10/Debuggers/$d/cdb.exe"
            if [ -x "$c" ]; then CDB="$c"; break; fi
          done
          for e in 组/*-x64.exe; do
            n=$(basename "$e" -x64.exe)
            (cd work && timeout 60 "../$e" > "../组/$n.out" 2> "../组/$n.err")
            code=$?
            if [ "$code" = 0 ] && cmp -s "组/$n.out" "组/$n.expected"; then
              echo "通过：$n"
            else
              echo "不符：$n（退出码 $code）"
              diff "组/$n.out" "组/$n.expected" | head -10
              head -c 800 "组/$n.err"
              if [ -n "$CDB" ]; then
                (cd work && "$CDB" -g -G -o -c ".lastevent;r;u @\$ip-0x30 L30;kn 20;dq 0x3800f0 L2;q" "../$e") 2>&1 | sed -n '/Access violation\|Last event/,$p' | head -90
              fi
            fi
          done
