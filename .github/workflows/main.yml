name: CI

env:
  YY_GC_INITIAL_HEAP_SIZE_MB: 512
  YY_GC_MAX_HEAP_SIZE_MB: 6144
  YY_BOOTSTRAP_URL: https://github.com/yuyan-lang/yuyan/releases/download/continuous-bootstrap/yuyan-bootstrap-bundle.tar.gz

on:
  push:
    branches: [yybs]
  pull_request:
    branches: [yybs]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bootstrap:
    name: Linux bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm make curl ripgrep

      - name: Build stable compiler from portable bootstrap release
        run: |
          set -euo pipefail
          bootstrap_archive="$RUNNER_TEMP/yuyan-bootstrap-bundle.tar.gz"
          bootstrap_root="$RUNNER_TEMP/yuyan-bootstrap"

          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --output "$bootstrap_archive" \
            "$YY_BOOTSTRAP_URL"
          mkdir -p "$bootstrap_root"
          tar -xzf "$bootstrap_archive" -C "$bootstrap_root" --strip-components=1
          find "$bootstrap_root" -type f \( -name '._*' -o -name '.DS_Store' \) -delete

          # 兼容仍含有已废弃 Boehm GC 引用的旧连续自举包。
          if [[ -f "$bootstrap_root/构建.sh" ]]; then
            sed -i '/^[[:space:]]*#include "gc.h"[[:space:]]*$/d' \
              "$bootstrap_root/运行时/原生/公共包含.h" \
              "$bootstrap_root/运行时/原生/入口.c"
            sed -i 's/ -lgc / /g' "$bootstrap_root/构建.sh"
          fi

          if [[ -x "$bootstrap_root/构建.sh" ]]; then
            "$bootstrap_root/构建.sh"
            bundled_compiler="$bootstrap_root/豫言自举编译器"
          else
            "$bootstrap_root/build.sh"
            bundled_compiler="$bootstrap_root/yy_bundled_bs"
          fi
          install -m 755 "$bundled_compiler" ./yy_bs_stable
          ./yy_bs_stable --version

      - name: Type-check compiler with stable bootstrap
        run: ./yy_bs_stable 豫言编译器/入口。豫 --type-check-only

      - name: Build stage 2 compiler
        run: make yy2_bs yy豫构引导

      - name: Build stage 3 compiler
        run: make yy3_bs

      - name: Build stage 4 compiler
        run: make yy4_bs

      - name: Verify fixed point
        run: cmp yy3_bs yy4_bs

      - name: 验证包构建与依赖边界
        run: make 类型检查 豫构测试

      - name: Publish continuous and historical bootstrap releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/yybs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          continuous_archive="$RUNNER_TEMP/yuyan-bootstrap-bundle.tar.gz"
          historical_release="historical-bootstrap"
          historical_asset="bootstrap-bundle-${GITHUB_SHA}.tar.gz"
          historical_archive="$RUNNER_TEMP/${historical_asset}"

          ./yy3_bs 豫言编译器/入口。豫 \
            --emit-bootstrap-bundle dist/yy-bootstrap --parallel
          find dist/yy-bootstrap -type f \( -name '._*' -o -name '.DS_Store' \) -delete
          tar -czf "$continuous_archive" -C dist yy-bootstrap
          cp "$continuous_archive" "$historical_archive"

          if ! gh release view "$historical_release" >/dev/null 2>&1; then
            gh release create "$historical_release" \
              --target "$GITHUB_SHA" \
              --title "Historical bootstrap bundles" \
              --latest=false \
              --notes "Immutable portable bootstrap bundles, indexed by their source commit."
          fi

          if gh release view "$historical_release" --json assets --jq '.assets[].name' \
            | grep -Fxq "$historical_asset"; then
            echo "Historical bootstrap asset already exists: $historical_asset"
          else
            gh release upload "$historical_release" "$historical_archive"
          fi

          gh release upload continuous-bootstrap "$continuous_archive" --clobber
