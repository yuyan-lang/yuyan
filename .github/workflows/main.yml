# 文言：全量测试之工作流：惟推 yybs 与手发之时行之；拉取之请惟核型（见 类型检查.yml）。自举既毕，诸平台之包、豫行工具链、系统光盘与诸试并起；发布惟「发布历史版本」一作，所发诸物既成即发，不待诸试。用户 2026-11-01 定：拉取之请惟核型，全量之试惟行于 yybs，发行惟一作。
# 汉语：全量测试工作流：只在推送 yybs 与手动触发时运行；拉取请求只跑类型检查（见 类型检查.yml）。自举之后，各平台工具链包、豫行工具链、系统光盘与各项测试并行；发布只有「发布历史版本」一个作业，发行物造好就发，不等测试。用户 2026-11-01 定：拉取请求只跑类型检查，全量测试只在 yybs 上跑，发布只有一个作业。
name: 全量测试

env:
  # 文言：起步之原生工具链包（Linux x64）：取连续版（continuous-binaries）最新之包，自举之作由此起步，不用 Node 与 Wasm。一轮自举既过（二三级逐字相同），发布历史版本之作即覆此包；不复定提交，亦不核摘要（用户 2026-10-18 定：能自举两遍而定点者即可用）。包中豫构 豫构稳定。林纳。豫行 配包中执行器 执行器。树码，先构今源之原生豫构为一级驱动，乃原生自举而核定点。今源于工具链自身用旧器所不识之写法或新原语者，须先推其支持之改，俟一轮自举既过、连续版易新包，乃用之。
  # 汉语：起步用的原生工具链包（Linux x64）：取连续版本（continuous-binaries）里最新的包，自举作业从它起步，不用 Node 与 Wasm。一轮自举通过（二、三级逐字节相同），「发布历史版本」作业就覆盖这个包；不再钉提交，也不核对摘要（用户 2026-10-18 定：能连自举两遍、定点一致就够用）。包里的豫构 豫构稳定。林纳。豫行 配包里的执行器 执行器。树码，先把当前源码编成原生豫构作一级驱动，再原生自举并核对定点。当前源码在工具链自身用到旧工具不认的写法或新原语时，先推送支持它的改动，等一轮自举通过、连续版本换上新包，再用。
  YY_NATIVE_TOOLCHAIN_URL: https://github.com/yuyan-lang/yuyan/releases/download/continuous-binaries/yuyan-native-linux-x64.tar.gz

on:
  push:
    branches: [yybs]
  workflow_dispatch:

permissions:
  contents: write

# 文言：工作流之并发组：同分支同时至多一轮行、一轮候；新推至则代其候者，行者照常竟之，发布亦竟。故推送虽频，待行者至多一轮，每轮皆全竟。
# 汉语：工作流级并发组：同一分支同时至多一轮在跑、一轮在等；新推送进来就替换正在等的那轮，正在跑的照常跑完（含发布）。推送再频繁，排队的也至多一轮，每轮都完整跑完。
concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: false

# 文言：诸作皆行于自有之机（pit-pc 之自托管 runner），不用 GitHub 之机。runner 书 CI 之境变量，豫构见之则不经将作；故诸步皆去 CI 而行，构建乃循本机之规，经将作排队、用共享之缓，试程经行在。
# 汉语：所有作业都跑在自有机器上（pit-pc 的自托管 runner），不用 GitHub 的机器。runner 会设环境变量 CI，豫构见了就不经将作；所以每一步都去掉 CI 再跑，构建照本机规矩经将作排队、用共享缓存，测试程序经行在。
defaults:
  run:
    shell: env -u CI bash -e {0}

# 文言：诸试之作仍各设作业之并发组（组名书作业之名，矩阵之作并书矩阵之值，否则同轮诸片相罢）；有工作流之组，同分支唯一轮在行，此组无所罢。
# 汉语：各测试作业仍保留作业级并发组（组名写死作业名，矩阵作业带矩阵值，否则同轮各片互相取消）；有了工作流级并发组，同一分支只有一轮在跑，这些组不再互相取消。
jobs:
  formatting-check:
    name: formatting check
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 90
    concurrency:
      group: formatting-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}
      - name: 解开测试工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"
      - name: 构建格式检查工具
        run: ./豫构。林纳。豫行 构建 源码格式化 检查 --输出 格式检查。林纳。豫行 -j "$(nproc)"
      # 文言：标签参数与命名元组之检：惟检所改之声明，依 AGENTS.md 有字面同类之参而未系标签者书警（函数恰二参者不检），签名、类之别名、类与构造器中元组相邻二项字面同类而未命名者亦书警（元组恰二项者不检）；此步纵败亦不败作业。基准取上一推之提交；不得则书一警而略之。
      # 汉语：标签参数与命名元组检查：只检查这次改动涉及的声明，按 AGENTS.md 有字面类型相同的参数却没带标签的发警告（函数恰好两个参数时不查），签名、类型别名、类型与构造器里元组相邻两项字面类型相同却没命名的也发警告（元组恰好两项时不查）；这一步自己失败也不让作业失败（continue-on-error）。基准取上一次推送的提交；取不到时发一条警告后跳过。
      - name: 标签参数与命名元组检查（只警告）
        continue-on-error: true
        env:
          YY_LABEL_BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$YY_LABEL_BASE" || true
          ./格式检查。林纳。豫行 --标签 "$YY_LABEL_BASE"
      # 文言：语义号之检（议一五〇五）：较基准与今之改，凡动编译之器一摊（库/译场、库/译场门、库/章句、冶铸）而未易语义号者，须提交之辞有一行「语义号：不换（缘由）」，否则书误而败此步；惟改注与排者，器自辨而略之。基准同标签之取法；浅克隆之史不足读提交之辞，故先取足深之史。
      # 汉语：编译语义号检查（议题 1505）：比较基准以来的改动，动了编译器一摊（库/译场、库/译场门、库/章句、冶铸）而没换编译语义号的，提交信息里须有一行「语义号：不换（缘由）」，否则报错并让这一步失败；只改注释与排版的由工具判出、自动放过。基准取法与「标签参数与命名元组检查」相同；浅克隆读不到提交信息，先取足够深的历史。
      - name: 编译语义号检查
        env:
          YY_SEMANTIC_BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$YY_SEMANTIC_BASE" || true
          git fetch --no-tags --depth=100 origin "$(git rev-parse HEAD)" || true
          ./格式检查。林纳。豫行 --语义号 "$YY_SEMANTIC_BASE"
      # 文言：篇名之检：Git 所录之篇与目录，名除半角点外皆汉字者，依 AGENTS.md 其缀当以全角句号「。」隔之；试之源其径无一段目名恰为「测试」者，亦书一警；列其名而书警，此步纵败亦不败作业。
      # 汉语：文件名检查：Git 受控的文件与目录名除半角点外全是汉字时，按 AGENTS.md 后缀应以全角句号「。」分隔；测试文件（`。测试。豫`、`。底层。测试。豫`）的路径里没有一段目录名恰为「测试」时也发一条警告；列出这些名字并发警告，这一步自己失败也不让作业失败（continue-on-error）。
      - name: 文件名检查（只警告）
        continue-on-error: true
        run: ./格式检查。林纳。豫行 --文件名
      # 文言：兜底之记之检（提案〇〇〇四〇）：执行器中诸定义所含之兜底（失败果四四、五八）之处数，当与供籍之兜底之记相合；未登、数不合、登而已无者，书一警；此步纵败亦不败作业。
      # 汉语：兜底登记检查（提案 00040）：执行器里各定义含的兜底（失败果四四、五八）处数要与供籍里的兜底登记一致；没登记、处数不符、登记了而源码里已没有的发一条警告，这一步自己失败也不让作业失败（continue-on-error）。
      - name: 兜底登记检查（只警告）
        continue-on-error: true
        run: ./格式检查。林纳。豫行 --兜底
      # 文言：状态格之检（议五九五、六六三）：执行器布局中诸格、诸槽与诸区之偏与其宽相核，格与格、区与区、格与区部分相犯则书误而败此步；格可全落于区，区可全含于他区，部分相交乃为犯。复核客体二号诸底层源，有在布局之外别定之格、槽、区者亦败。宽依定表、源中读写原语与布局注中之段；宽不可判者依八字算而列之。只核其文，不改其布。
      # 汉语：状态格布局检查（议题 595、663）：核对执行器布局里各状态格、暂存槽与区段的偏移与宽度，格与格、区与区、格与区部分重叠就报错并让这一步失败；单格可以整格落在区段里，区段可以整段含在另一段里，部分相交才算错。再核对客体二号全部底层源文件，有在布局之外另定格、槽、区段的也失败。宽度依次取定表、源码里的读写原语与布局注释里的段说明；判不出的按八字节算并列出来。只核对布局文字，不改布局。
      - name: 状态格布局检查
        run: ./格式检查。林纳。豫行 --状态格
      # 文言：验收之程之检（议一二零五）：验收目下之程不得导宿主专用之库借道，等待当取豫章「差遣」之限时让；有犯则书误而败此步。
      # 汉语：验收程序检查（议题 1205）：`验收/` 目录下的程序不得导入宿主专用库「借道」，等待应从豫章「差遣」的限时让取；有违反就报错并让这一步失败。
      - name: 验收程序不得借用宿主专用库
        run: ./格式检查。林纳。豫行 --验收
      # 文言：弃果之检（议一一八八，用户 2026-10-28 定）：返成否或已登之误码类之呼，其值于「令」中弃之而后不复用者，书误而败此步；一律列之，不以注免。改之惟二途：以鉴分成败，或上传之。
      # 汉语：丢弃结果检查（议题 1188，用户 2026-10-28 定）：返回「成否」或登记过的出错码类型的调用，值在「令」里丢掉、后面又没再用的，报错并让这一步失败；一律列出，不按注释豁免。改法只有两种：用「鉴」分开成败，或者往上传。
      - name: 不得丢掉成否与出错码
        run: ./格式检查。林纳。豫行 --弃果
      # 文言：试印之检（议一四五三）：库/ 下非试之源凡留临时打点「试印」者书误而败此步；试印者，排查之时插一行以观其值，事毕即撤，写成亦不得入。
      # 汉语：临时打点检查（议题 1453）：`库/` 下非测试的源文件里出现临时打点「试印」就报错并让这一步失败；试印是排查时插一行看值的临时打印，写完就撤，留不进库。
      - name: 库代码不得留临时打点
        run: ./格式检查。林纳。豫行 --试印
      # 文言：删缀裸取之检（议一五五八）：径取删首、删尾之果者书误而败此步，不设注免；有则去、无则存者用剥首、剥尾，分二支者用鉴。
      # 汉语：删缀裸取检查（议题 1558）：对删首、删尾的结果裸用取之的报错并让这一步失败，不设注释豁免；要“有则去、无则留”用剥首、剥尾，要分开两支用鉴。
      - name: 删首删尾的结果不得裸用取之
        run: ./格式检查。林纳。豫行 --删缀裸取
      # 文言：包说生成段之检（议一四六〇）：包说标记间之函目当与模签合；不合则书误而败此步。改签之后以文档网站生成器之改包说明重书。
      # 汉语：包说明生成段检查（议题 1460）：包说明标记之间的函数清单应与模块签名一致；不一致就报错并让这一步失败。改了签名后用文档网站生成器的「改包说明」重写。
      - name: 包说明函数清单与模块签名一致
        run: ./格式检查。林纳。豫行 --包说明
      # 文言：排版之核：取所检之篇（同无参之核：.豫 与 。豫，略 yuyan-vscode 与 *_v0），按处理器之数并行（一程一篇：大篇数则相邻，合批则拖慢全程），惟告警。
      # 汉语：排版检查：取与无参检查相同的文件（.豫 与 。豫，跳过 yuyan-vscode 与 *_v0），按处理器数并行（每个进程查一个文件：几个最慢的大文件在目录里挨着，合成一批会拖慢全程），只发警告。
      - name: 检查排版（只警告，按核数并行）
        run: |
          set -euo pipefail
          git -c core.quotepath=false ls-files | grep -E '(。|\.)豫$' | grep -v -e 'yuyan-vscode/' -e '_v0/' \
            | tr '\n' '\0' | xargs -0 -P "$(nproc)" -n 1 ./格式检查。林纳。豫行 --只查排版
      # 文言：校名：名或篇径含英文字母、阿拉伯数字或下划线者书误；仓中旧名犹带阿拉伯数字，许此步败而不败其作（continue-on-error，用户 2026-10-14 定）。
      # 汉语：核对标识符：标识符或路径含英文字母、阿拉伯数字或下划线时报错；仓里旧名还带阿拉伯数字，这一步允许失败，不让作业失败（continue-on-error，用户 2026-10-14 定）。
      - name: 检查标识符（允许失败）
        continue-on-error: true
        run: ./格式检查。林纳。豫行 --只查标识符

  # 文言：自举之作：原生起步，不用 Node 与 Wasm。起于所定之原生工具链包：包中豫构配包中执行器，先构今源之六十四位原生豫构（一级驱动，今源之码行于旧执行器），乃以之原生自举而核定点，装原生工具链，更构全树测试之器与网页后端之 Wasm 编译器与豫构，上传之，使诸试早起。发行之包归 发行.yml。
  # 汉语：自举作业：原生起步，不用 Node 与 Wasm。从固定的原生工具链包起步：包里的豫构配包里的执行器，先把当前源码编成六十四位原生豫构（一级驱动：当前源码的代码跑在旧执行器上），再由它原生自举并核对定点、装上原生工具链，接着构建全树测试工具与网页后端用的 Wasm 编译器与豫构，然后上传，让各项测试尽早开始。发行用的包归 发行.yml。
  bootstrap:
    name: 自举
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # 文言：取连续版最新之包，解于仓根：豫构于己旁求执行器。连续版之包覆时或暂缺，故多试数次。
      # 汉语：取连续版本里最新的包，解压到仓库根目录：豫构在自己旁边找执行器。连续版本的包被覆盖时可能短暂取不到，所以多重试几次。
      - name: 下载最新的原生工具链包
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/yuyan-native-stable.tar.gz"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 10 \
            --output "$archive" "$YY_NATIVE_TOOLCHAIN_URL"
          tar -xzf "$archive"

      # 文言：一级驱动以今源之码生，故二三级所出者同（定点）；包中之执行器与包中豫构同代，侧表之式相合。
      # 汉语：一级驱动由当前源码生成，二、三级的代码生成就一致（定点）；配包里的执行器，是因为它与包里的豫构同代、侧表格式相合。
      - name: 以包中豫构构建当前源码的一级原生豫构
        run: |
          ./豫构稳定。林纳。豫行 构建 豫构 --输出 豫构。林纳。豫行 -j "$(nproc)" -- --目标 本机 --执行器 执行器。树码 --降级缓存 .豫构缓存/降级缓存/豫构一级。林纳。豫行.机器片

      # 文言：构建之事皆归豫构之仓库目标（应用/豫构/仓库目标。豫），诸目标并行而缓存；仓无 Makefile。此作诸作之所待。「全部」原生自举而核定点，装原生工具链，乃以原生豫构构网页后端之 Wasm 编译器、豫构与值桥。
      # 汉语：构建统一交给豫构的仓库目标（应用/豫构/仓库目标。豫），由构建编排并行调度与缓存，仓库里没有 Makefile。本作业是其他作业的前置。「全部」原生自举并核对定点、装上原生工具链，然后由原生豫构构建网页后端用的 Wasm 编译器、豫构与值桥。
      - name: 原生自举并核对定点，装上原生工具链，构建 Wasm 编译器、豫构与值桥
        run: ./豫构。林纳。豫行 全部 -j "$(nproc)"

      - name: 构建全树测试工具
        run: ./豫构。林纳。豫行 目标 全树测试工具 -j "$(nproc)"

      # 文言：诸试所用之原生试器，并同代之 Wasm 编译器、豫构与值桥，供全树之试中所登之诺驿之试。
      # 汉语：打包各测试作业用的原生测试工具，附同代的 Wasm 编译器、豫构与值桥，供全树测试里登记的诺驿测试用。
      - name: 打包测试工具
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/测试工具.tar.gz" 编译器。林纳。豫行 豫构。林纳。豫行 执行器。树码 全树测试。林纳。豫行 编译器.wasm 豫构.wasm 豫言操作系统/宿主/节点/节点值桥接.wasm

      - name: 上传测试工具
        uses: actions/upload-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}/测试工具.tar.gz
          retention-days: 1
          if-no-files-found: error

      # 文言：上传构建之志（.构建日志），败亦上传，以备析构建之时；式见 应用/度量/构建性能/日志格式.文言.md。
      # 汉语：上传本作业的构建日志（.构建日志 是隐藏目录，须显式包含），失败时也上传，供日后分析构建耗时；格式见 应用/度量/构建性能/日志格式.汉语.md。
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-bootstrap
          path: .构建日志/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore

  # 文言：核型与豫构之试，取自举所成之器，不连带重造。
  # 汉语：类型检查与豫构测试：取自举作业的产物运行，用 --不连带 不重建其依赖；与全树测试等其他测试并行。
  checks:
    name: 类型检查与豫构测试
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开测试工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      - name: 类型检查与豫构测试
        run: ./豫构。林纳。豫行 目标 类型检查 豫构测试 --不连带 -j "$(nproc)"

      # 文言：上传构建之志（.构建日志），败亦上传，以备析构建之时；式见 应用/度量/构建性能/日志格式.文言.md。
      # 汉语：上传本作业的构建日志（.构建日志 是隐藏目录，须显式包含），失败时也上传，供日后分析构建耗时；格式见 应用/度量/构建性能/日志格式.汉语.md。
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-checks
          path: .构建日志/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore

  # 文言：全树之试，不分片：一作取自举所成之器，行全树（用户 2026-11-01 定：惟占一机）。自托管之 runner 无托管机六时之限，故时限宽设。
  # 汉语：全树测试不分片：一个作业用自举作业产出的工具跑完整棵树（用户 2026-11-01 定：只占一台机器）。自托管 runner 没有托管机 6 小时的上限，时限放宽。
  full-tree-tests:
    name: 全树测试
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开全树测试工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      - name: 运行全树测试
        run: ./全树测试。林纳。豫行

  # 文言：抽样之轮行验收之层：全量之轮及可取公数者，依提交号末位四、五而星，手发者必行；余轮不行，验层仍留本机手行。
  # 汉语：抽样轮次运行验收层：完整轮数与可取公开数据者，按提交号末位 4、5 抽样，手动触发必跑；其余轮次不跑，验收层仍由本机手工运行。
  acceptance-sampled:
    name: 抽样验收层
    needs: bootstrap
    if: github.event_name == 'workflow_dispatch' || endsWith(github.sha, '4') || endsWith(github.sha, '5')
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开全树测试工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      # 文言：验收层所须公数，皆取定址：统一码十八版之 IdnaTestV2、msgpack-test-suite 定提交（MIT）；统一码升版则与同文之数并改。
      # 汉语：验收层需要的公开数据都从固定地址取：Unicode 18.0.0 的 IdnaTestV2、msgpack-test-suite 固定提交（MIT 许可）；Unicode 升版时连同同文的数据一起改。
      - name: 取验收层公开数据
        run: |
          mkdir -p dist/验收数据
          curl -fsSL https://www.unicode.org/Public/18.0.0/idna/IdnaTestV2.txt -o dist/验收数据/IdnaTestV2.txt
          curl -fsSL https://raw.githubusercontent.com/kawanet/msgpack-test-suite/e04f6edeaae589c768d6b70fcce80aa786b7800e/dist/msgpack-test-suite.json -o dist/验收数据/消息包参考向量.json

      - name: 验收层：公开数据与默认集小种子
        run: |
          ./全树测试。林纳。豫行 --验收 --只 库/群书/仓颉部/同文/测试/全量/
          ./全树测试。林纳。豫行 --验收 --只 库/群书/簿式部/简象/测试/全量/

      # 文言：云工既不复支，十一月一日撤其持久对象壳之验。
      # 汉语：云工已不再支持，2026-11-01 撤掉云工持久对象壳的验收。
      - name: 安装扩展依赖
        run: npm --prefix 应用/百工坊/yuyan-vscode ci

      - name: 验收层：VS Code 语法高亮核验
        run: ./全树测试。林纳。豫行 --验收 --只 应用/百工坊/yuyan-vscode/

      # 文言：全量之轮。常集以参数唯行一分，此则不带参而尽行之；封套官方之全逾三十分，故径行而不经全树之器。
      # 汉语：完整轮数。默认集用参数只跑一部分，这里不带参数跑完整轮；封套官方完整一轮超过三十分钟，所以直接运行而不经全树测试的时限。
      - name: 构建完整轮数的程序
        run: |
          mkdir -p dist/验收层
          ./豫构。林纳。豫行 文件 库/群书/仓颉部/同文/测试/全量/域名百万变异。测试。豫 --输出 dist/验收层/域名百万变异 -j 12
          ./豫构。林纳。豫行 文件 库/群书/仓颉部/同文/测试/全量/模糊核验。测试。豫 --输出 dist/验收层/模糊核验 -j 12
          ./豫构。林纳。豫行 文件 库/群书/仓颉部/正则全量测试/测试/正则模糊。测试。豫 --输出 dist/验收层/正则模糊 -j 12
          ./豫构。林纳。豫行 文件 库/群书/簿式部/简册/测试/全量/变异。测试。豫 --输出 dist/验收层/简册变异 -j 12
          ./豫构。林纳。豫行 文件 库/群书/仓颉部/易码/测试/编码模糊。测试。豫 --输出 dist/验收层/编码模糊 -j 12
          ./豫构。林纳。豫行 文件 库/群书/阴书部/阴书/测试/全量/封套官方。测试。豫 --输出 dist/验收层/封套官方 -j 12
          ./豫构。林纳。豫行 文件 库/群书/簿式部/简象/测试/全量/模糊。测试。豫 --输出 dist/验收层/简象模糊 -j 12

      - name: 完整轮数：域名百万变异
        run: timeout 3600 ./dist/验收层/域名百万变异

      - name: 完整轮数：模糊核验
        run: timeout 3600 ./dist/验收层/模糊核验

      - name: 完整轮数：正则模糊
        run: timeout 3600 ./dist/验收层/正则模糊

      - name: 完整轮数：简册变异
        run: timeout 3600 ./dist/验收层/简册变异

      - name: 完整轮数：编码模糊
        run: timeout 5400 ./dist/验收层/编码模糊

      - name: 完整轮数：封套官方
        run: timeout 5400 ./dist/验收层/封套官方 完整

      - name: 完整轮数：简象模糊
        run: timeout 3600 ./dist/验收层/简象模糊

  # 文言：轩窗之交叉工具链：取自举所成之原生豫构，于 Linux 径出轩窗兼容六十四之原生豫构，并预编其前导，验其可成；惟编不行（轩窗之机未备，见议题 #1605）。林檎与 Linux 臂六十四之包归 发行.yml。轩窗之降级已有六十四位址之内存（触乃提交，提案〇〇〇二一），原生豫构可起；今之限在动区八吉（回收之堆约三点七吉，见冶铸之「鹄长址页容量限」）。
  # 汉语：轩窗交叉工具链：用自举作业产出的原生豫构，在 Linux 上直出 Windows 兼容六十四的原生豫构，并预编前导，核对编得出来；只编不跑（还没有自有的 Windows 机器，见议题 #1605）。macOS 与 Linux 臂六十四的包归 发行.yml。Windows 的降级已有六十四位地址内存（碰到才提交，提案 00021），原生豫构能起；现在的限制是动态区 8 GiB（回收堆约 3.7 GiB，见 冶铸 的「鹄长址页容量限」）。
  cross-toolchains:
    name: 轩窗交叉工具链
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: windows-x64
            system: 轩窗
            prog: 豫构.exe
            arch: 兼容六十四
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开本轮工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      - name: 交叉直出原生豫构
        run: |
          set -euo pipefail
          out="交叉产物/${{ matrix.plat }}"
          mkdir -p "$out"
          ./豫构。林纳。豫行 构建 豫构 --输出 "$out/${{ matrix.prog }}" -j "$(nproc)" -- --目标 本机 --目标系统 ${{ matrix.system }} --目标架构 ${{ matrix.arch }} --执行器 "$PWD/执行器。树码" --降级缓存 "$PWD/.豫构缓存/降级缓存/豫构${{ matrix.plat }}.机器片"
          cp 执行器。树码 "$out/"
          rm -f "$out"/*.链接印

      # 文言：轩窗之包随带预编之前导（#993）：以本轮原生豫构为轩窗编好前导之单元与阶缓，收于 预编缓存/，轩窗初交直接装入，不必现编几十分钟。列以包中目标之执行器（与 豫构.exe 所嵌者同）为单元之器：单元机器码依其布局而生，印记其摘，轩窗入装时乃合（#993 第三轮：轩窗兼为绝对址式，依林檎相对式所编之单元一执行即“array.new_data 越界”）。
      # 汉语：Windows 包随带预编前导（#993）：用本轮原生豫构为 Windows 编好前导单元与阶段缓存，收进 预编缓存/，Windows 上第一次交互直接装入，不必现编几十分钟。用包里目标那份执行器（与 豫构.exe 所嵌的同一份）编单元：单元机器码照它的布局生成、印记记它的摘要，Windows 上入装才核对得上（#993 第三轮：Windows AMD64 按绝对址式运行，照 macOS 相对址式编的单元一执行就“array.new_data 越界”）。
      - name: 预编轩窗前导
        run: |
          set -euo pipefail
          out="交叉产物/${{ matrix.plat }}"
          ./豫构。林纳。豫行 预编打包 "$out" -- -j "$(nproc)" --目标系统 轩窗 --目标架构 兼容六十四 --执行器 "$out/执行器。树码"

  # 文言：豫行工具链（提案〇〇〇二一）：以本轮之原生豫构编二构之豫构豫行与四宿主之豫行启动器（轩窗兼者亦在其中），打包而传，供跨宿主之验与可执行包之冒烟。
  # 汉语：豫行工具链（提案 00021）：用本轮的原生豫构编出两架构的豫构豫行与四个宿主的豫行启动器（含 Windows x86-64），打包上传，供跨宿主验证与可执行包程序冒烟用。
  yuxing-toolchain:
    name: 豫行工具链
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开本轮工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      - name: 打豫行工具链包
        run: |
          set -euo pipefail
          ./豫构。林纳。豫行 目标 豫行打包 --不连带 -j "$(nproc)"
          tar -czf "$RUNNER_TEMP/yuyan-yuxing-toolchain.tar.gz" -C 豫行工具链 .

      - uses: actions/upload-artifact@v4
        with:
          name: 豫行工具链包
          path: ${{ runner.temp }}/yuyan-yuxing-toolchain.tar.gz
          retention-days: 7
          if-no-files-found: error

  # 文言：豫行于宿主（提案〇〇〇二一）：于 Linux x64 之机，以包中之启动器行豫构豫行：发现诸包，构原生你好之豫行版，复以启动器行之（印你好，以七退）。Linux 臂六十四、林檎、轩窗之机未备，见议题 #1605。
  # 汉语：豫行跨宿主运行（提案 00021）：在 Linux x64 机器上用包里的启动器运行豫构豫行：发现包、构建原生你好的豫行版，再用启动器运行它（打印你好，退出码 7）。Linux 臂六十四、macOS、Windows 还没有自有机器，见议题 #1605。
  yuxing-hosts:
    name: 豫行跨宿主（${{ matrix.plat }}）
    needs: yuxing-toolchain
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            launcher: 豫行启动器兼。林纳。豫行
            yuxing: 豫构兼。豫行
            arch: 兼容六十四
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 豫行工具链包
          path: ${{ runner.temp }}

      - name: 解开豫行工具链包
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/yuyan-yuxing-toolchain.tar.gz"
          chmod +x "${{ matrix.launcher }}"

      - name: 发现包并构建运行原生你好的豫行版
        run: |
          set -euo pipefail
          ./"${{ matrix.launcher }}" "${{ matrix.yuxing }}" 发现 --树 > 豫行发现.txt
          grep -F '豫章（库/豫章）' 豫行发现.txt
          ./"${{ matrix.launcher }}" "${{ matrix.yuxing }}" 构建 原生你好 豫行入口 --输出 编你好 -j "$(getconf _NPROCESSORS_ONLN)" -- --目标 本机 --目标系统 豫言 --目标架构 ${{ matrix.arch }}
          set +e
          ./"${{ matrix.launcher }}" 编你好 > 你好.txt
          code=$?
          set -e
          grep -F '你好' 你好.txt
          test "$code" = 7

  # 文言：抽样之轮较合成与直出（提案〇〇〇二一议九之条件一）：于 Linux x64 之机，以本轮之原生豫构与合成之单文件豫构（包中之启动器加豫构豫行）各冷构豫言编译器为豫行二次，交替而行，降级之缓存与出目各别；书其时与比，合成逾直出一点一倍则书警，不败。他平台之机未备，见议题 #1605。
  # 汉语：抽样轮次比较合成与直出（提案 00021 议九的条件①）：在 Linux x64 机器上，用本轮的原生豫构与合成的单文件豫构（包里的启动器加豫构豫行）各冷构建两次豫言编译器（编成豫行），交替进行，降级缓存与输出目录各用各的；打印耗时与比值，合成慢过直出 1.1 倍时只发警告。其他平台还没有自有机器，见议题 #1605。
  yuxing-compare:
    name: 抽样 合成与直出对比（${{ matrix.plat }}）
    needs: [bootstrap, yuxing-toolchain]
    if: github.event_name == 'workflow_dispatch' || endsWith(github.sha, '0') || endsWith(github.sha, '1') || endsWith(github.sha, '2') || endsWith(github.sha, '3')
    runs-on: [self-hosted, pit-pc]
    env:
      YY_XI: 林纳
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            native-artifact: 测试工具
            native-tar: 测试工具.tar.gz
            launcher: 豫行启动器兼。林纳。豫行
            yuxing: 豫构兼。豫行
            arch: 兼容六十四
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.native-artifact }}
          path: ${{ runner.temp }}

      - uses: actions/download-artifact@v4
        with:
          name: 豫行工具链包
          path: ${{ runner.temp }}

      # 文言：原生之包解于仓根（得 豫构。<系>。豫行 与执行器之树码）；豫行之包解于别目，以启动器合成单文件之豫构于仓根。
      # 汉语：原生包解到仓库根目录（得 豫构。<系>。豫行 与执行器汇编树码）；豫行包解到另一个目录，用其中的启动器在仓库根目录合成单文件豫构。
      - name: 解包并合成单文件豫构
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/${{ matrix.native-tar }}"
          mkdir -p 豫行包
          tar -xzf "$RUNNER_TEMP/yuyan-yuxing-toolchain.tar.gz" -C 豫行包
          chmod +x 豫构。${YY_XI}。豫行 "豫行包/${{ matrix.launcher }}"
          "./豫行包/${{ matrix.launcher }}" --合成 "豫行包/${{ matrix.yuxing }}" 豫构合成。${YY_XI}。豫行
          chmod +x 豫构合成。${YY_XI}。豫行

      - name: 冷构建编译器各两次并比较耗时
        run: |
          set -euo pipefail
          j="$(getconf _NPROCESSORS_ONLN)"
          for i in 1 2 3 4; do
            case "$i" in 1|4) p=豫构。${YY_XI}。豫行 ;; *) p=豫构合成。${YY_XI}。豫行 ;; esac
            d="$RUNNER_TEMP/对比$i"
            mkdir -p "$d"
            s="$(date +%s)"
            if ! "./$p" 构建 豫言编译器 --输出 "$d/编译器" -j "$j" -- --目标 本机 --目标系统 豫言 --目标架构 ${{ matrix.arch }} --执行器 "$PWD/执行器。树码" --降级缓存 "$d/降级.机器片" --do-not-load-cache > "$d/构建.txt" 2>&1; then
              tail -n 60 "$d/构建.txt"
              exit 1
            fi
            e="$(date +%s)"
            echo "第 ${i} 次（${p}）：$((e - s)) 秒"
            eval "t$i=$((e - s))"
          done
          n=$((t1 + t4))
          c=$((t2 + t3))
          r="$(awk -v c="$c" -v n="$n" 'BEGIN { printf "%.2f", c / n }')"
          echo "直出 $n 秒，合成 $c 秒，合成为直出的 $r 倍"
          if awk -v c="$c" -v n="$n" 'BEGIN { exit !(c > 1.1 * n) }'; then
            echo "::warning title=合成慢于直出（${{ matrix.plat }}）::合成豫构冷构建编译器 $c 秒，直出 $n 秒，为 $r 倍，超过 1.1 倍"
          fi

  # 文言：可执行包之程（云仓提案 C00004）：以本轮之原生豫构编清单诸应用为兼容六十四之豫行（与造盘置于 /工具 者同式），并其清单（仓库目标「可执行包程序」，缺省惟编 豫言-兼容六十四）；以豫行工具链包之林兼启动器行你好之豫行以冒烟（印你好，以七退）。其布由社区包仓库：发行.yml 之发布之作抄此诸应用入 yuyan-lang/yuyan-community-packages，社区仓库之 CI 编诸目标而布于包仓库 yuyan-lang.org，豫言系统之“安装软件”读其汇总目录；语言仓不复传于 GitHub 之发行版。
  # 汉语：可执行包程序（云仓提案 C00004）：用本轮的原生豫构把清单里的应用编成 AMD64 豫行（与造盘放进 /工具 的工具同一种格式），连同清单（仓库目标「可执行包程序」，缺省只编 豫言-兼容六十四）；用豫行工具链包里的林兼启动器运行你好的豫行版作冒烟（打印你好，退出码 7）。发布走社区包仓库：发行.yml 的发布作业把这些应用复制进 yuyan-lang/yuyan-community-packages，社区仓库的 CI 编全部目标、发布进包仓库 yuyan-lang.org，豫言系统的“安装软件”读那里的汇总目录；语言仓不再上传 GitHub 发行版。
  os-software:
    name: 可执行包程序冒烟
    needs: [bootstrap, yuxing-toolchain]
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开本轮工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      - name: 编可执行包程序与清单
        run: ./豫构。林纳。豫行 目标 可执行包程序 --不连带 -j "$(nproc)"

      - uses: actions/download-artifact@v4
        with:
          name: 豫行工具链包
          path: ${{ runner.temp }}

      # 文言：程既编，乃解豫行工具链之包于仓根（其执行器之树码同代，覆之无害），以林兼启动器行你好之豫行。
      # 汉语：程序编好后再把豫行工具链包解到仓库根目录（包里的执行器树码与本轮同代，覆盖无妨），用林兼启动器运行你好的豫行版。
      - name: 冒烟：用林兼启动器运行你好
        run: |
          set -euo pipefail
          cat 可执行包程序/清单。数据。豫
          tar -xzf "$RUNNER_TEMP/yuyan-yuxing-toolchain.tar.gz"
          chmod +x 豫行启动器兼。林纳。豫行
          set +e
          ./豫行启动器兼。林纳。豫行 可执行包程序/豫言-兼容六十四/你好 > 你好.txt
          code=$?
          set -e
          cat 你好.txt
          grep -F '你好' 你好.txt
          test "$code" = 7

  # 文言：预编之客于 Linux 实机行全组，逐字校裸机之参，免以 Rosetta 之存储映射误作后端之败。兼容六十四用自举所成之原生工具，皆原生，不用 Node；臂六十四之机未备，见议题 #1605。
  # 汉语：在 Linux x86-64 机器上直接执行完整预编一致性组；macOS 上的 Rosetta 对大预编产物报 mmap 错误，不能代替实机验收。用自举作业产出的原生工具，都是原生程序，不经 Node；arm64 还没有自有机器，见议题 #1605。
  native-aot-linux:
    name: Linux 预编一致性（${{ matrix.arch }}）
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-native-aot-linux-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 兼容六十四
            tools: 测试工具
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.tools }}
          path: ${{ runner.temp }}/工具

      - name: 解开本轮原生工具
        run: tar -xzf "$RUNNER_TEMP"/工具/*.tar.gz

      - name: 构建原生一致性工具
        run: ./豫构。林纳。豫行 文件 豫言操作系统/裸机/原生一致性。豫 --输出 原生一致性。林纳。豫行 -j "$(nproc)"

      # 汉语：远程文件内部协议先构建底层烟验，再以两种 Linux 架构实际运行。
      # 文言：远程文内约先造底层之验，复于 Linux 二构实运行之。
      - name: 构建远程文件协议烟验
        run: >-
          ./豫构。林纳。豫行 文件 豫言操作系统/裸机/客体二号/测试/远程文件。底层。测试。豫
          --输出 远程文件协议。林纳。豫行 -j "$(nproc)"
          -- --目标 本机 --目标系统 林纳 --目标架构 '${{ matrix.arch }}'

      # 汉语：两个运行步骤各设超时兜底（平时烟验 0 秒、完整组约 2 分钟）。10-14 烟验过期时 ARM 版每轮挂满 90 分钟：当时 Linux 原生目标的陷阱照裸机用户态出 svc #7、mov eax,7; int 0x80，Linux 只回一个错误码，程序接着往下执行。已修：宿主目标的陷阱改出 brk #0 / ud2，检查一失败进程即以 133（ARM64）/ 132（AMD64）退出。
      # 文言：二运行之步各设时限以备不虞（常时烟验零秒，全组约二分）。十月十四日烟验过时，臂者每轮挂满九十分：彼时 Linux 原生之陷循裸机客态出 svc 七与 int 0x80，Linux 唯返误码而续行。今已修：宿主之标之陷改出 brk 零与 ud2，一验不合则进程以百三十三（臂）或百三十二（兼）而退。
      - name: 运行远程文件协议原生烟验
        timeout-minutes: 5
        run: ./远程文件协议。林纳。豫行

      - name: 运行完整预编一致性组
        timeout-minutes: 20
        run: |
          ./原生一致性。林纳。豫行 --系统 林纳 --架构 '${{ matrix.arch }}' --经 直接 > 林纳预编一致性.log 2>&1 || {
            printf '::error title=Linux 预编一致性失败::%s\n' "$(tail -c 2000 林纳预编一致性.log | tr '\n' ' ')"
            exit 1
          }
          tail -n 24 林纳预编一致性.log


  # 文言：系统光盘之冒烟：取自举所成之原生豫构，造豫言系统之器而成两架构之混合 ISO，QEMU 无头启 x86-64 之盘而验之。冒烟之试惟在此；发行.yml 惟造盘发之，不冒烟。
  # 汉语：系统光盘冒烟：用自举作业产出的原生豫构构建造盘工具，造两种架构的混合 ISO，再用 QEMU 无头启动 x86-64 那张验证。冒烟只在这里跑；发行.yml 只造盘、发布，不冒烟。
  os-smoke:
    name: 系统光盘冒烟
    needs: bootstrap
    runs-on: [self-hosted, pit-pc]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: 测试工具
          path: ${{ runner.temp }}

      - name: 解开本轮编译与构建工具
        run: tar -xzf "$RUNNER_TEMP/测试工具.tar.gz"

      - name: 构建豫言系统工具
        run: ./豫构。林纳。豫行 目标 造盘工具 --不连带 -j "$(nproc)"

      # 文言：惟呼「启动盘」之令，不录 ISO 内之文件；盘中之物由 豫言系统 定之。二构各造一张，各入其目。前后各书盘之余量（议一一二八：察空盘足容二盘否）。
      # 汉语：只调用「启动盘」子命令，不写死 ISO 内部的文件清单，ISO 里放什么由 豫言系统 决定。两种架构各造一张光盘，各自放进自己的输出目录。前后各印一次盘量（议题 #1128：查空闲盘够不够造两张）。
      - name: 造混合启动 ISO（x86-64 与 ARM64）
        id: iso
        run: |
          set -euo pipefail
          df -h / "${RUNNER_TEMP:-/tmp}" /tmp
          ./豫言系统。林纳。豫行 启动盘 --输出 启动介质 --预置 无
          df -h /; du -sh 启动介质 .豫构缓存 "/tmp/豫构缓存-$(id -un)" 2>/dev/null || true
          ./豫言系统。林纳。豫行 启动盘 --架构 臂六十四 --输出 启动介质臂 --预置 无
          df -h /; du -sh 启动介质臂 2>/dev/null || true

      # 文言：冒烟之试：QEMU 无头启 ISO，候命令壳，按键入「图形」，截帧验桌面之底色；题壁之布始无窗，复按交替加回车启终端之窗而键 abc，验画有变；SeaBIOS 与 OVMF 各一。pit-pc 已装 QEMU 与 OVMF，有 /dev/kvm 则以之加速；无则改纯模拟（甚缓）。
      # 汉语：冒烟测试：QEMU 无头启动 ISO，等命令壳就绪，按键输入「图形」，截帧核对桌面底色；题壁布局开场没有窗口，再按交替加回车开一个终端窗并键入 abc，核对画面有变化；SeaBIOS 与 OVMF 各跑一次。pit-pc 已装 QEMU 与 OVMF，有 /dev/kvm 就用 KVM 加速；没有就跑纯模拟（很慢）。
      - name: 冒烟测试（KVM 加速，SeaBIOS 与 OVMF）
        run: |
          set -euo pipefail
          code=""; vars=""
          for f in /usr/share/OVMF/OVMF_CODE.fd /usr/share/OVMF/OVMF_CODE_4M.fd; do if [ -f "$f" ]; then code=$f; fi; done
          for f in /usr/share/OVMF/OVMF_VARS.fd /usr/share/OVMF/OVMF_VARS_4M.fd; do if [ -f "$f" ]; then vars=$f; fi; done
          echo "OVMF：$code $vars"
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ./豫言系统。林纳。豫行 冒烟 启动介质/豫言启动.iso --加速 kvm
            ./豫言系统。林纳。豫行 冒烟 启动介质/豫言启动.iso --加速 kvm --固件 "$code" --固件变量 "$vars"
          else
            echo "::warning::没有可用的 /dev/kvm，改跑纯模拟冒烟（很慢）"
            ./豫言系统。林纳。豫行 冒烟 启动介质/豫言启动.iso
            ./豫言系统。林纳。豫行 冒烟 启动介质/豫言启动.iso --固件 "$code" --固件变量 "$vars"
          fi

      # 文言：纯模拟之冒烟，惟记其数，败不败作（议二四六：纯模拟下「图形」至桌面首帧逾十五分钟）。KVM 之冒烟败亦行之，取其数以防后诊；惟造盘败则不行（无完盘可启，议一一二八）。
      # 汉语：纯模拟冒烟只记数，失败不让作业失败（议题 246：纯模拟下「图形」到桌面首帧超过十五分钟）。KVM 冒烟失败也照跑，留个数供以后诊断；造盘失败就不跑（没有完整的光盘可启，议题 #1128）。
      - name: 冒烟测试（纯模拟，只记数）
        if: always() && steps.iso.outcome == 'success'
        continue-on-error: true
        run: ./豫言系统。林纳。豫行 冒烟 启动介质/豫言启动.iso
