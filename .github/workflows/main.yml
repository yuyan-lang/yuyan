name: CI

env:
  YY_GC_MAX_HEAP_SIZE_MB: 400

on:
  push:
    branches: [yybs]
  pull_request:
    branches: [yybs]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    name: Linux bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install bootstrap compiler and runtime
        uses: ./.github/actions/install-linux-dependencies@v2

      - name: Type-check compiler with stable bootstrap
        run: ./yy_bs_stable 豫言编译器/入口。豫 --type-check-only --parallel

      - name: Build stage 2 compiler
        run: ./yy_bs_stable 豫言编译器/入口。豫 -o yy2_bs --parallel

      - name: Build stage 3 compiler
        run: ./yy2_bs 豫言编译器/入口。豫 -o yy3_bs --parallel

      - name: Build stage 4 compiler
        run: ./yy3_bs 豫言编译器/入口。豫 -o yy4_bs --parallel

      - name: Verify fixed point
        run: cmp yy3_bs yy4_bs

      - name: Upload bootstrapped compiler
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-linux-amd64-bootstrap-compiler
          if-no-files-found: error
          path: |
            ./yy3_bs
            ./运行时支持库/*.a
            ./运行时支持库/*.so
