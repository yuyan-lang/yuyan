# 文言：功能建议（GitHub issue 之表）：问其所涉、所欲解之事与所拟之法。表项不设 id，GitHub 之 id 惟许 ASCII 也。
# 汉语：功能建议（GitHub issue 表单）：问清涉及哪部分、想解决什么、建议怎么做。表单项不设 id，因为 GitHub 的 id 只许 ASCII。
name: 功能建议
description: 为豫言操作系统、豫言语言或工具提出新功能或改进。
title: "功能建议："
body:
  - type: markdown
    attributes:
      value: |
        第一公测版只求能启动、有图形界面，后续版本要补的功能见发行说明的“已知限制”。建议已在其中的，欢迎补充你的用法与需求。

  - type: dropdown
    attributes:
      label: 涉及部分
      options:
        - 豫言操作系统
        - 豫言语言与编译器
        - 构建与工具链（豫构等）
        - 库
        - 文档与官网
        - 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: 想解决的问题
      description: 想做到什么，现在做不到或不方便在哪里。
    validations:
      required: true

  - type: textarea
    attributes:
      label: 建议的做法
      description: 希望它怎样工作；可附草图、截图或示例代码。

  - type: textarea
    attributes:
      label: 其他做法与补充
      description: 考虑过的其他办法、相关链接等。
